services:
  - type: web
    name: assignment-signal
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: python -m gunicorn assignment_signal.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DJANGO_PRODUCTION
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_VAPID_SUBJECT
        value: mailto:contact@example.com

  - type: cron
    name: assignment-signal-notifications
    runtime: python
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py send_assignment_notifications
    envVars:
      - key: DJANGO_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_VAPID_SUBJECT
        value: mailto:contact@example.com
