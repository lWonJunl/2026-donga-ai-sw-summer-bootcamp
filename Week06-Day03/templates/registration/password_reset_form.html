{% extends "base.html" %}

{% block title %}비밀번호 찾기 · 우선콕{% endblock %}

{% block content %}
<section class="settings-form card">
    <p class="eyebrow">RESET PASSWORD</p>
    <h1>비밀번호를 잊으셨나요?</h1>
    <p class="muted">가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="field-group{% if field.errors %} has-error{% endif %}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
                {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
            </div>
        {% endfor %}
        <button class="button primary auth-submit" type="submit">재설정 링크 보내기</button>
    </form>
</section>
{% endblock %}
