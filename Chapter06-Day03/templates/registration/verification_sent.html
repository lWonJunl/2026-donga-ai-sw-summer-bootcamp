{% extends "base.html" %}

{% block title %}인증 메일 발송 · 우선콕{% endblock %}

{% block content %}
<section class="auth-result card">
    <span class="result-icon">✉</span>
    <p class="eyebrow">CHECK YOUR EMAIL</p>
    <h1>인증 메일을 보냈습니다.</h1>
    <p><strong>{{ email }}</strong>으로 발송된 링크를 열면 회원가입이 완료됩니다.</p>
    <small>메일이 보이지 않으면 스팸함을 확인해 주세요.</small>
    <a class="button secondary" href="{% url 'landing' %}">첫 화면으로 돌아가기</a>
</section>
{% endblock %}
