{% extends "base.html" %}

{% block title %}그룹 참여 · 우선콕{% endblock %}

{% block content %}
<section class="form-card compact card">
    <p class="eyebrow">JOIN CLASS</p>
    <h1>초대 코드로 참여</h1>
    <p class="muted">그룹 관리자에게 받은 8자리 초대 코드를 입력하세요.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button primary full" type="submit">그룹 참여하기</button>
    </form>
</section>
{% endblock %}
